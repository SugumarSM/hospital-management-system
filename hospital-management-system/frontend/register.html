<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - Medicare Hospital</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reg-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            padding: 30px 15px;
        }
        .reg-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 720px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="reg-page">
    <div class="reg-card">
        <div style="background:#1e3a8a; color:white; padding:25px 30px; text-align:center;">
            <h2 style="font-size:22px; font-weight:800; margin-bottom:4px;">Patient Registration</h2>
            <p style="font-size:13px; color:#bfdbfe;">Create your digital health record account</p>
        </div>

        <form id="regForm" style="padding:30px;">
            <h4 style="font-size:14px; text-transform:uppercase; color:#64748b; letter-spacing:0.5px; margin-bottom:15px; border-bottom:1px solid #e2e8f0; padding-bottom:6px;">
                1. Account Credentials
            </h4>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="username">Desired Username *</label>
                    <input type="text" id="username" class="form-control-custom" placeholder="e.g. jdoe99" required minlength="3">
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" id="email" class="form-control-custom" placeholder="john@example.com" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password *</label>
                <input type="password" id="password" class="form-control-custom" placeholder="At least 6 characters" required minlength="6">
            </div>

            <h4 style="font-size:14px; text-transform:uppercase; color:#64748b; letter-spacing:0.5px; margin:20px 0 15px; border-bottom:1px solid #e2e8f0; padding-bottom:6px;">
                2. Personal & Health Profile
            </h4>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="full_name">Full Legal Name *</label>
                    <input type="text" id="full_name" class="form-control-custom" placeholder="e.g. Johnathan Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number *</label>
                    <input type="tel" id="phone" class="form-control-custom" placeholder="e.g. 9876543210" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="date_of_birth">Date of Birth *</label>
                    <input type="date" id="date_of_birth" class="form-control-custom" required value="1995-06-15">
                </div>
                <div class="form-group">
                    <label class="form-label" for="gender">Gender *</label>
                    <select id="gender" class="form-control-custom">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="blood_group">Blood Group</label>
                    <select id="blood_group" class="form-control-custom">
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+" selected>O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="emergency_contact">Emergency Contact Name & Phone *</label>
                    <input type="text" id="emergency_contact" class="form-control-custom" placeholder="e.g. Mary Doe (9876543211)" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="address">Residential Address *</label>
                <textarea id="address" class="form-control-custom" rows="2" placeholder="Street, City, Pin Code" required></textarea>
            </div>

            <button type="submit" id="regBtn" class="btn-primary-custom" style="width:100%; justify-content:center; padding:12px; font-size:15px; margin-top:10px;">
                Complete Registration
            </button>

            <div style="text-align:center; margin-top:20px; font-size:13px; color:#64748b;">
                Already registered? <a href="login.html" style="color:#1a56db; font-weight:600; text-decoration:none;">Log In Here</a>
                <br><br>
                <a href="index.html" style="color:#64748b; text-decoration:none;">← Return to Home</a>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById("regForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("regBtn");
            btn.disabled = true;
            btn.innerText = "Registering...";

            const payload = {
                username: document.getElementById("username").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value,
                full_name: document.getElementById("full_name").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                date_of_birth: document.getElementById("date_of_birth").value,
                gender: document.getElementById("gender").value,
                blood_group: document.getElementById("blood_group").value,
                emergency_contact: document.getElementById("emergency_contact").value.trim(),
                address: document.getElementById("address").value.trim(),
                role: "patient"
            };

            try {
                const res = await API.post("/auth/register", payload);
                showToast(res.message || "Registration successful! Please login.", "success");
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1200);
            } catch (err) {
                showToast(err.message || "Registration failed.", "error");
                btn.disabled = false;
                btn.innerText = "Complete Registration";
            }
        });
    </script>
</body>
</html>
