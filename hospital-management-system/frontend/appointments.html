<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Medicare HMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>

        <div class="main-wrapper">
            <header class="top-navbar">
                <div class="navbar-title">Outpatient Appointment Scheduling</div>
                <div class="navbar-actions">
                    <button class="btn-primary-custom btn-sm-custom" onclick="openBookModal()">+ Book Appointment</button>
                </div>
            </header>

            <main class="content-body">
                <div class="custom-card">
                    <div class="card-header-flex">
                        <div>
                            <span class="card-title">Consultation Schedule</span>
                        </div>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <select id="filter-status" class="form-control-custom" style="width: 150px; font-size: 13px;" onchange="loadAppointments()">
                                <option value="">All Statuses</option>
                                <option value="Pending">Pending</option>
                                <option value="Confirmed">Confirmed</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                            <input type="date" id="filter-date" class="form-control-custom" style="width: 160px; font-size: 13px;" onchange="loadAppointments()">
                            <button class="btn-secondary-custom btn-sm-custom" onclick="resetFilters()">Reset</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>Appt #</th>
                                    <th>Patient</th>
                                    <th>Doctor & Department</th>
                                    <th>Date & Slot</th>
                                    <th>Reason</th>
                                    <th>Consultation Fee</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="appts-tbody">
                                <tr><td colspan="8" style="text-align: center; padding: 25px;">Loading appointments...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Book Appointment Modal -->
    <div id="bookModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Book Clinical Appointment</h3>
                <button class="modal-close" onclick="closeModal('bookModal')">&times;</button>
            </div>
            <form id="bookForm">
                <div class="modal-body">
                    <div class="form-group" id="patient-select-group">
                        <label class="form-label">Patient *</label>
                        <select id="book-patient-id" class="form-control-custom" required>
                            <option value="">Select Patient</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Doctor & Specialty *</label>
                        <select id="book-doctor-id" class="form-control-custom" required>
                            <option value="">Select Doctor</option>
                        </select>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label class="form-label">Appointment Date *</label>
                            <input type="date" id="book-date" class="form-control-custom" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Time Slot *</label>
                            <select id="book-time" class="form-control-custom" required>
                                <option value="09:00">09:00 AM</option>
                                <option value="09:30">09:30 AM</option>
                                <option value="10:00">10:00 AM</option>
                                <option value="10:30">10:30 AM</option>
                                <option value="11:00">11:00 AM</option>
                                <option value="11:30">11:30 AM</option>
                                <option value="12:00">12:00 PM</option>
                                <option value="14:00">02:00 PM</option>
                                <option value="14:30">02:30 PM</option>
                                <option value="15:00">03:00 PM</option>
                                <option value="15:30">03:30 PM</option>
                                <option value="16:00">04:00 PM</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Reason for Visit</label>
                        <input type="text" id="book-reason" class="form-control-custom" placeholder="e.g. Chest pain, Follow-up, Routine consultation" value="Routine consultation">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary-custom" onclick="closeModal('bookModal')">Cancel</button>
                    <button type="submit" class="btn-primary-custom">Schedule & Confirm Slot</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Reschedule Modal -->
    <div id="rescheduleModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 480px;">
            <div class="modal-header">
                <h3>Reschedule Appointment</h3>
                <button class="modal-close" onclick="closeModal('rescheduleModal')">&times;</button>
            </div>
            <form id="rescheduleForm">
                <div class="modal-body">
                    <input type="hidden" id="resched-id">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label class="form-label">New Date *</label>
                            <input type="date" id="resched-date" class="form-control-custom" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Time Slot *</label>
                            <select id="resched-time" class="form-control-custom" required>
                                <option value="09:00">09:00 AM</option>
                                <option value="09:30">09:30 AM</option>
                                <option value="10:00">10:00 AM</option>
                                <option value="10:30">10:30 AM</option>
                                <option value="11:00">11:00 AM</option>
                                <option value="11:30">11:30 AM</option>
                                <option value="14:00">02:00 PM</option>
                                <option value="14:30">02:30 PM</option>
                                <option value="15:00">03:00 PM</option>
                                <option value="15:30">03:30 PM</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary-custom" onclick="closeModal('rescheduleModal')">Cancel</button>
                    <button type="submit" class="btn-primary-custom">Update Appointment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let currentUser = null;
        let appointmentsList = [];

        function openModal(id) { document.getElementById(id).classList.add("active"); }
        function closeModal(id) { document.getElementById(id).classList.remove("active"); }

        async function initAppointments() {
            currentUser = await Auth.checkAuth(["admin", "doctor", "receptionist", "patient"]);
            if (!currentUser) return;
            Auth.renderNavigation("appointments");

            if (currentUser.role === "patient") {
                document.getElementById("patient-select-group").style.display = "none";
            }

            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById("book-date").value = tomorrow.toISOString().split('T')[0];

            await loadDropdowns();

            // Check if URL has doc_id parameter
            const params = new URLSearchParams(window.location.search);
            const docParam = params.get("doc_id");
            if (docParam) {
                document.getElementById("book-doctor-id").value = docParam;
                openBookModal();
            }

            await loadAppointments();
        }

        async function loadDropdowns() {
            try {
                const [dRes, pRes] = await Promise.all([
                    API.get("/doctors?status=active"),
                    currentUser.role !== 'patient' ? API.get("/patients") : Promise.resolve({ data: [] })
                ]);

                const dSel = document.getElementById("book-doctor-id");
                dSel.innerHTML = '<option value="">Select Doctor</option>' + (dRes.data || []).map(d => `
                    <option value="${d.id}">${d.full_name} (${d.department_name}) - ₹${d.consultation_fee}</option>
                `).join("");

                if (currentUser.role !== 'patient') {
                    const pSel = document.getElementById("book-patient-id");
                    pSel.innerHTML = '<option value="">Select Patient</option>' + (pRes.data || []).map(p => `
                        <option value="${p.id}">${p.full_name} (${p.patient_code})</option>
                    `).join("");
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function loadAppointments() {
            const status = document.getElementById("filter-status").value;
            const date = document.getElementById("filter-date").value;
            let q = [];
            if (status) q.push(`status=${status}`);
            if (date) q.push(`date=${date}`);
            const queryStr = q.length ? `?${q.join("&")}` : "";

            try {
                const res = await API.get(`/appointments${queryStr}`);
                appointmentsList = res.data || [];
                renderAppointments(appointmentsList);
            } catch (err) {
                showToast("Failed to load appointments: " + err.message, "error");
            }
        }

        function renderAppointments(list) {
            const tbody = document.getElementById("appts-tbody");
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 25px; color:#64748b;">No appointments found matching filters.</td></tr>`;
                return;
            }
            tbody.innerHTML = list.map(a => `
                <tr>
                    <td>#${a.id}</td>
                    <td>
                        <strong>${a.patient_name}</strong><br>
                        <small style="color:#64748b;">${a.patient_code}</small>
                    </td>
                    <td>
                        ${a.doctor_name}<br>
                        <small style="color:#64748b;">${a.department_name}</small>
                    </td>
                    <td>
                        <strong>${a.appointment_date}</strong><br>
                        <small style="color:#64748b;">🕒 ${a.appointment_time}</small>
                    </td>
                    <td>${a.reason || 'Consultation'}</td>
                    <td>₹${a.consultation_fee.toFixed(2)}</td>
                    <td><span class="badge-status badge-${a.status.toLowerCase()}">${a.status}</span></td>
                    <td>
                        ${a.status !== 'Cancelled' && a.status !== 'Completed' ? `
                            <button class="btn-secondary-custom btn-sm-custom" onclick="openReschedule(${a.id}, '${a.appointment_date}', '${a.appointment_time}')">Reschedule</button>
                            <button class="btn-secondary-custom btn-sm-custom" style="color:#dc2626;" onclick="cancelAppt(${a.id})">Cancel</button>
                        ` : `<span style="font-size:12px; color:#64748b;">--</span>`}
                    </td>
                </tr>
            `).join("");
        }

        function resetFilters() {
            document.getElementById("filter-status").value = "";
            document.getElementById("filter-date").value = "";
            loadAppointments();
        }

        function openBookModal() {
            openModal("bookModal");
        }

        function openReschedule(id, date, time) {
            document.getElementById("resched-id").value = id;
            document.getElementById("resched-date").value = date;
            document.getElementById("resched-time").value = time;
            openModal("rescheduleModal");
        }

        async function cancelAppt(id) {
            if (!confirm("Are you sure you want to cancel this appointment?")) return;
            try {
                await API.post("/appointments/cancel", { id });
                showToast("Appointment cancelled successfully.", "info");
                loadAppointments();
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        document.getElementById("bookForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {
                doctor_id: parseInt(document.getElementById("book-doctor-id").value),
                appointment_date: document.getElementById("book-date").value,
                appointment_time: document.getElementById("book-time").value,
                reason: document.getElementById("book-reason").value.trim()
            };

            if (currentUser.role !== "patient") {
                payload.patient_id = parseInt(document.getElementById("book-patient-id").value);
            }

            try {
                await API.post("/appointments", payload);
                showToast("Appointment booked successfully!", "success");
                closeModal("bookModal");
                loadAppointments();
            } catch (err) {
                showToast(err.message, "error");
            }
        });

        document.getElementById("rescheduleForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = parseInt(document.getElementById("resched-id").value);
            const date = document.getElementById("resched-date").value;
            const time = document.getElementById("resched-time").value;

            try {
                await API.put("/appointments", {
                    id,
                    appointment_date: date,
                    appointment_time: time
                });
                showToast("Appointment rescheduled!", "success");
                closeModal("rescheduleModal");
                loadAppointments();
            } catch (err) {
                showToast(err.message, "error");
            }
        });

        initAppointments();
    </script>
</body>
</html>
