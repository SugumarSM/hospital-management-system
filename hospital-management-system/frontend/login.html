<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Medicare Hospital Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .login-header {
            background: #1e3a8a;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-header h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .demo-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }
        .demo-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #334155;
        }
        .demo-btn:hover {
            background: #1a56db;
            color: white;
            border-color: #1a56db;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div style="font-size:32px; margin-bottom:10px;">🏥</div>
            <h2>Medicare Portal Login</h2>
            <p style="font-size:13px; color:#bfdbfe;">Sign in with your role-authorized credentials</p>
        </div>

        <div style="padding:30px;">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username or Staff ID</label>
                    <input type="text" id="username" class="form-control-custom" placeholder="e.g. admin or dr.smith" required autocomplete="username">
                </div>

                <div class="form-group" style="margin-bottom:20px;">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control-custom" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <button type="submit" id="loginBtn" class="btn-primary-custom" style="width:100%; justify-content:center; padding:12px; font-size:15px;">
                    Secure Sign In
                </button>
            </form>

            <div style="margin-top:25px;">
                <div style="font-size:12px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px;">
                    💡 Quick Fill Demo Credentials:
                </div>
                <div class="demo-badges">
                    <button type="button" class="demo-btn" onclick="fillCreds('admin', 'admin123')">👑 Admin</button>
                    <button type="button" class="demo-btn" onclick="fillCreds('dr.smith', 'doctor123')">🩺 Doctor (Cardiology)</button>
                    <button type="button" class="demo-btn" onclick="fillCreds('receptionist', 'recep123')">🛎️ Receptionist</button>
                    <button type="button" class="demo-btn" onclick="fillCreds('patient1', 'patient123')">👤 Patient (Rahul)</button>
                </div>
            </div>

            <div style="text-align:center; margin-top:25px; font-size:13px; color:#64748b;">
                New patient? <a href="register.html" style="color:#1a56db; font-weight:600; text-decoration:none;">Create Patient Account</a>
                <br><br>
                <a href="index.html" style="color:#64748b; text-decoration:none;">← Back to Home Page</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function fillCreds(u, p) {
            document.getElementById("username").value = u;
            document.getElementById("password").value = p;
            showToast(`Filled credentials for ${u}`, "info");
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("expired")) {
            showToast("Your session has expired. Please log in again.", "info");
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            const userField = document.getElementById("username");
            const passField = document.getElementById("password");

            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                const res = await API.post("/auth/login", {
                    username: userField.value.trim(),
                    password: passField.value
                });

                API.setToken(res.data.token);
                API.setUser(res.data);
                showToast("Login successful! Redirecting...", "success");

                setTimeout(() => {
                    Auth.redirectToDashboard(res.data.role);
                }, 700);

            } catch (err) {
                showToast(err.message || "Login failed. Please check credentials.", "error");
                btn.disabled = false;
                btn.innerText = "Secure Sign In";
            }
        });
    </script>
</body>
</html>
