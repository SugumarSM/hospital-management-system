# Apache HTTP Server Configuration for Hospital Management System
# Place or include this file in Apache conf.d or httpd.conf

# Define server listen port
Listen 8080

<VirtualHost *:8080>
    ServerName localhost
    ServerAdmin admin@hospital.com

    # DocumentRoot points to frontend static files
    DocumentRoot "C:/Users/Sugumar/Music/New folder (2)/hospital-management-system/frontend"

    # Static frontend directory permissions
    <Directory "C:/Users/Sugumar/Music/New folder (2)/hospital-management-system/frontend">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # CGI ScriptAlias mapping /api requests directly to compiled C binary
    ScriptAlias /api/ "C:/Users/Sugumar/Music/New folder (2)/hospital-management-system/build/hospital_api.cgi/"
    ScriptAlias /api "C:/Users/Sugumar/Music/New folder (2)/hospital-management-system/build/hospital_api.cgi"

    # C CGI Binary directory permissions
    <Directory "C:/Users/Sugumar/Music/New folder (2)/hospital-management-system/build">
        AllowOverride None
        Options +ExecCGI
        Require all granted
        AddHandler cgi-script .cgi .exe
    </Directory>

    # Environment variables passed to C CGI
    SetEnv HOSPITAL_DB_PATH "C:/Users/Sugumar/Music/New folder (2)/hospital-management-system/database/hospital.db"

    # Logging
    ErrorLog "logs/hospital_error.log"
    CustomLog "logs/hospital_access.log" common
</VirtualHost>

